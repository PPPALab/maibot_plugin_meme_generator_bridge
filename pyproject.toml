[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maibot-plugin-meme-generator-bridge"
version = "0.1.3"
description = "MaiBot SDK bridge to a self-hosted Rust meme generator"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<0.29", "httpcore>=1,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["maibot-plugin-sdk==2.20.0", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "packaging>=22", "tomli>=2"]

[tool.setuptools]
packages = ["maibot_plugin_meme_generator_bridge"]
package-dir = {maibot_plugin_meme_generator_bridge = "."}

[tool.setuptools.package-data]
maibot_plugin_meme_generator_bridge = ["_manifest.json", "README.md", "CHANGELOG.md", "LICENSE", "requirements.txt", "deploy/compose.yaml", "deploy/.env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
